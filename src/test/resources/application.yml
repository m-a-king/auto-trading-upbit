spring:
  application:
    name: auto-trading-with-upbit-api

  config:
    import: optional:file:.env[.properties]

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Logging
logging:
  level:
    root: INFO
    com.making.auto_trading_with_upbit_api: DEBUG

upbit:
  api:
    base-url: https://api.upbit.com
    access-key: ${UPBIT_ACCESS_KEY}
    secret-key: ${UPBIT_SECRET_KEY}
